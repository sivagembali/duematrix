services:
  # Backend API Service
  - type: web
    name: duematrix-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --workers 3 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: duematrix-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    
  # Frontend Static Site
  - type: web
    name: duematrix-frontend
    runtime: static
    buildCommand: cd duematrix-app && npm install && npm run build -- --configuration production
    staticPublishPath: ./duematrix-app/dist/duematrix-app/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: duematrix-db
    databaseName: duematrix
    user: duematrix_user
