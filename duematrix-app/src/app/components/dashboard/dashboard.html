<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="header-left">
        <h1>DueMatrix</h1>
        @if (currentUser) {
          <div class="user-info">
            <span class="welcome-text">Welcome, {{ currentUser.first_name }} {{ currentUser.last_name }}</span>
          </div>
        }
      </div>
      <div class="header-right">
        <!-- Cycle selector moved to per-table header (user-table) as requested -->

        <button 
          pButton 
          label="Dashboard" 
          icon="pi pi-home"
          class="p-button-text"
          routerLink="/dashboard"
          [ngClass]="{ 'active-nav-link': isActive('/dashboard', true) }"
        ></button>
        @if (isAdmin()) {
          <button 
            pButton 
            label="Reports" 
            icon="pi pi-chart-line"
            class="p-button-text"
            routerLink="/reports"
            [ngClass]="{ 'active-nav-link': isActive('/reports') }"
          ></button>
          <button 
            pButton 
            label="Config" 
            icon="pi pi-cog"
            class="p-button-text"
            routerLink="/config/users"
            [ngClass]="{ 'active-nav-link': isActive('/config') }"
          ></button>
        }
        <button 
          pButton 
          label="Logout" 
          icon="pi pi-sign-out"
          class="p-button-outlined p-button-secondary"
          (click)="logout()"
        ></button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <router-outlet></router-outlet>
    
    <!-- Headers Configuration panel removed from dashboard per request -->
  </main>
</div>
