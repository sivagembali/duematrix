<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="header-left">
        <h1>DueMatrix</h1>
        @if (currentUser) {
          <div class="user-info">
            <span class="welcome-text">Welcome, {{ currentUser.first_name }} {{ currentUser.last_name }}</span>
          </div>
        }
      </div>
      <div class="header-right">
        <div class="cycle-selector" style="display:inline-block; margin-right:1rem;">
          <label for="cycleSelect" style="margin-right:0.5rem; color: #fff;">Cycle:</label>
          <select id="cycleSelect" [(ngModel)]="selectedCycle" (change)="onCycleChange(selectedCycle)">
            @if (cycles.length === 0) {
              <option value="">Loading...</option>
            }
            @for (c of cycles; track c.id) {
              <option [value]="c.cycle_name">{{ c.cycle_name }}</option>
            }
          </select>
        </div>

        <button 
          pButton 
          label="Dashboard" 
          icon="pi pi-home"
          class="p-button-text"
          routerLink="/dashboard"
        ></button>
        @if (isAdmin()) {
          <button 
            pButton 
            label="Config" 
            icon="pi pi-cog"
            class="p-button-text"
            routerLink="/config/users"
          ></button>
        }
        <button 
          pButton 
          label="Logout" 
          icon="pi pi-sign-out"
          class="p-button-outlined p-button-secondary"
          (click)="logout()"
        ></button>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <router-outlet></router-outlet>
    
    <!-- Headers Configuration panel removed from dashboard per request -->
  </main>
</div>
